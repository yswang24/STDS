[project]
name = "stds"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2",
    "httpx>=0.24",
    "fastapi>=0.100",
    "python-multipart>=0.0.9",
    "uvicorn>=0.20",
    "sse-starlette>=1.0",
    "sqlalchemy>=2.0",
    "streamlit>=1.49",
    "openpyxl>=3.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: opt-in tests that call paid external services",
]
